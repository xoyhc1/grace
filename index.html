<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

    <meta name="theme-color" content="#000000">

    <title></title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
            color: rgb(126, 126, 126);
        }

        .error-message {
            position: fixed;

            top: 184px;
            left: 50%;
            transform: translateX(-50%);

            width: 330px;

            margin: 0;
            padding: 0;

            text-align: center;

            font-size: 17px;
            font-weight: 400;
            line-height: 26px;

            letter-spacing: 0;

            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>

<body>

    <div class="error-message">
        Safari can’t open the page because<br>
        the server can’t be found.
    </div>

</body>
</html>
