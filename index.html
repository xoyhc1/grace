<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Grace</title>
</head>
<body>
<script>
(async () => {
    const encryptedData = "eRjD6aZAY9+26fIyo5NaBrpEgsyOiofrGphymLZU5KYYH4W6Kcf8y3BPefrPp58s0M0BznnYTlKetEpNsO/UNY4xty6Xv0jV8MICq53NGbAX5pQOGJ2yHvvCmWmbcsDH7hdv";
    const saltData = "OqplVSvwO5HJ0oN4z4PVuw==";
    const ivData = "5/pywjv1qSrqvXyJ";
    const lockedPage = "\u003chead>\n\u003ctitle>nigger\u003c/title>\n\u003c/head>\n\n\u003cbody>\n\u003cp>goodbye\u003c/p>\n\u003c/body>";

    function fromBase64(str) {
        const binary = atob(str);
        const bytes = new Uint8Array(binary.length);

        for (let i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }

        return bytes;
    }

    function showLockedPage() {
        document.open();
        document.write(lockedPage);
        document.close();
    }

    const password = new URLSearchParams(window.location.search).get("pwd");

    if (!password) {
        showLockedPage();
        return;
    }

    try {
        const encoder = new TextEncoder();

        const passwordKey = await crypto.subtle.importKey(
            "raw",
            encoder.encode(password),
            "PBKDF2",
            false,
            ["deriveKey"]
        );

        const key = await crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: fromBase64(saltData),
                iterations: 250000,
                hash: "SHA-256"
            },
            passwordKey,
            {
                name: "AES-GCM",
                length: 256
            },
            false,
            ["decrypt"]
        );

        const decrypted = await crypto.subtle.decrypt(
            {
                name: "AES-GCM",
                iv: fromBase64(ivData),
                tagLength: 128
            },
            key,
            fromBase64(encryptedData)
        );

        const html = new TextDecoder().decode(decrypted);

        document.open();
        document.write(html);
        document.close();
    } catch (error) {
        showLockedPage();
    }
})();
</script>
</body>
</html>
